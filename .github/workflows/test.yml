name: Test

on:
  push:
    branches: [master, develop, main]
  pull_request:
    branches: [master, develop, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goarch: amd64 }
          - { os: ubuntu-latest, goarch: '386' }
          - { os: ubuntu-24.04-arm, goarch: arm64 }
          - { os: windows-latest, goarch: amd64 }
          - { os: windows-latest, goarch: '386' }
          - { os: windows-11-arm, goarch: arm64 }
          - { os: macos-latest, goarch: arm64 }
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
